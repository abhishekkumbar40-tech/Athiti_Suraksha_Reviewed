<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Trusted Helpers</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{

    background:#f5f5f5;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;
}

.container{

    width:500px;

    background:white;

    padding:25px;

    border-radius:20px;

    box-shadow:0px 0px 15px rgba(0,0,0,0.2);
}

h1{

    text-align:center;

    color:#ff4d6d;

    margin-bottom:20px;
}

input,
select{

    width:100%;

    padding:14px;

    margin-top:12px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:16px;
}

button{

    width:100%;

    padding:15px;

    margin-top:18px;

    border:none;

    border-radius:10px;

    background:#ff4d6d;

    color:white;

    font-size:18px;

    cursor:pointer;
}

button:hover{

    background:#e63e5c;
}

.preview{

    width:120px;

    height:120px;

    border-radius:50%;

    object-fit:cover;

    margin:auto;

    display:block;

    margin-top:20px;

    border:4px solid #ff4d6d;
}

.card{

    background:#fafafa;

    margin-top:20px;

    padding:20px;

    border-radius:15px;

    border:1px solid #ddd;
}

.card img{

    width:90px;

    height:90px;

    border-radius:50%;

    object-fit:cover;

    margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>➕ Add Trusted Officer</h1>

<input
type="text"
id="firstName"
placeholder="First Name">

<input
type="text"
id="lastName"
placeholder="Last Name">

<input
type="text"
id="aadhaar"
maxlength="12"
placeholder="Aadhaar Number">

<select id="gender">

<option value="">Select Gender</option>

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

<input
type="text"
id="mobile"
maxlength="10"
placeholder="Mobile Number">

<select id="state">

<option value="">Select State</option>

<option>Karnataka</option>
<option>Maharashtra</option>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Delhi</option>
<option>Goa</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
<option>Uttar Pradesh</option>
<option>Rajasthan</option>
<option>Punjab</option>
<option>Gujarat</option>
<option>West Bengal</option>
<option>Bihar</option>
<option>Odisha</option>
<option>Madhya Pradesh</option>

</select>

<input
type="text"
id="district"
placeholder="District">

<input
type="text"
id="city"
placeholder="City">

<input
type="file"
id="photo"
accept="image/*">

<img
id="preview"
class="preview"
src="https://via.placeholder.com/120">

<button onclick="saveHelper()">

Save Helper

</button>

<div id="helperList"></div>

</div>

<script>

/* PHOTO PREVIEW */

let photoData = "";

document
.getElementById("photo")
.addEventListener("change", function(){

    const file = this.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        photoData = e.target.result;

        document
        .getElementById("preview")
        .src = photoData;
    }

    reader.readAsDataURL(file);

});

/* LOAD OLD HELPERS */

let helpers =

JSON.parse(
localStorage.getItem("helpers")
) || [];

/* SAVE HELPER */

function saveHelper(){

    const firstName =
    document.getElementById("firstName").value;

    const lastName =
    document.getElementById("lastName").value;

    const aadhaar =
    document.getElementById("aadhaar").value;

    const gender =
    document.getElementById("gender").value;

    const mobile =
    document.getElementById("mobile").value;

    const state =
    document.getElementById("state").value;

    const district =
    document.getElementById("district").value;

    const city =
    document.getElementById("city").value;

    /* VALIDATION */

    if(aadhaar.length != 12){

        alert("Aadhaar must be 12 digits");

        return;
    }

    if(mobile.length != 10){

        alert("Mobile number must be 10 digits");

        return;
    }

    const helper = {

        firstName,
        lastName,
        aadhaar,
        gender,
        mobile,
        state,
        district,
        city,
        photo:photoData

    };

    helpers.push(helper);

    localStorage.setItem(

        "helpers",

        JSON.stringify(helpers)

    );

    alert("Helper Saved Successfully");

    loadHelpers();

}

/* SHOW HELPERS */

function loadHelpers(){

    const box =
    document.getElementById("helperList");

    box.innerHTML = "";

    helpers.forEach(h=>{

        box.innerHTML += `

        <div class="card">

        <img src="${h.photo}">

        <h2>

        ${h.firstName}
        ${h.lastName}

        </h2>

        <p>

        🪪 Aadhaar:
        ${h.aadhaar}

        </p>

        <p>

        👤 Gender:
        ${h.gender}

        </p>

        <p>

        📞 ${h.mobile}

        </p>

        <p>

        📍 ${h.city},
        ${h.district},
        ${h.state}

        </p>

        </div>

        `;

    });

}

loadHelpers();

</script>

</body>

</html>
