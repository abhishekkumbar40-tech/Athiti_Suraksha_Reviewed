<!DOCTYPE html>
<html>

<head>

    <title>Athiti AI Chatbot</title>

    <style>

        body{

            font-family:Arial;
            background:#f5f5f5;
            margin:0;
            padding:0;
        }

        .container{

            width:700px;
            margin:auto;
            margin-top:30px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        h1{

            text-align:center;
            color:#222;
        }

        #chatBox{

            height:500px;
            overflow-y:auto;
            border:1px solid #ccc;
            padding:15px;
            margin-top:20px;
            border-radius:5px;
            background:#fafafa;
        }

        .user{

            text-align:right;
            margin-top:15px;
            color:blue;
            font-size:18px;
        }

        .bot{

            text-align:left;
            margin-top:15px;
            color:green;
            font-size:18px;
        }

        .input-area{

            display:flex;
            margin-top:20px;
        }

        input{

            flex:1;
            padding:15px;
            border-radius:5px;
            border:1px solid #ccc;
            font-size:16px;
        }

        button{

            width:120px;
            margin-left:10px;
            border:none;
            border-radius:5px;
            background:red;
            color:white;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{

            background:darkred;
        }

    </style>

</head>

<body>

<div class="container">

<h1>Athiti AI</h1>

<div id="chatBox">

<div class="bot">

<b>AI:</b>

Hello! Welcome to Athiti AI.
How can I help you today?

</div>

</div>

<div class="input-area">

<input
type="text"
id="question"
placeholder="Ask anything...">

<button onclick="sendMessage()">

Send

</button>

</div>

</div>

<script>

async function sendMessage(){

    const question =
    document.getElementById("question").value;

    if(question.trim() === ""){

        return;
    }

    const chatBox =
    document.getElementById("chatBox");

    /* USER MESSAGE */

    chatBox.innerHTML +=

    `<div class="user">

    <b>You:</b> ${question}

    </div>`;

    /* GROQ API KEY */

    const API_KEY =
    "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";

    try{

        const response = await fetch(

"https://api.groq.com/openai/v1/chat/completions",

{

    method:"POST",

    headers:{

        "Content-Type":"application/json",

        "Authorization":
        `Bearer ${API_KEY}`

    },

    body:JSON.stringify({

        model:"llama-3.3-70b-versatile",

        messages:[

            {

                role:"system",

                content:
                "You are Athiti AI tourist assistant."

            },

            {

                role:"user",

                content:question

            }

        ]

    })

});

        const data = await response.json();

        console.log(data);

        let answer =
        "AI not responding.";

        if(
            data.choices &&
            data.choices.length > 0
        ){

            answer =
            data.choices[0]
            .message
            .content;
        }

        /* BOT MESSAGE */

        chatBox.innerHTML +=

        `<div class="bot">

        <b>AI:</b>

        ${answer}

        </div>`;

    }

    catch(error){

        console.log(error);

        chatBox.innerHTML +=

        `<div class="bot">

        <b>AI:</b>

        Error connecting to AI server.

        </div>`;
    }

    /* AUTO SCROLL */

    chatBox.scrollTop =
    chatBox.scrollHeight;

    /* CLEAR INPUT */

    document.getElementById("question").value = "";

}

</script>

</body>

</html>
