<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Atithi Suraksha | Welcome</title>
    <link rel="stylesheet" href="welcome.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
        }


        /* =================================================
           FULL SCREEN BACKGROUND
        ================================================= */

        .welcome-screen {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background-image:
                url("255008.png");

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            overflow: hidden;
        }


        /* =================================================
           VERY LIGHT OVERLAY
           Keeps original screenshot appearance
        ================================================= */

        .screen-overlay {

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(0, 20, 50, 0.02),
                    rgba(0, 20, 50, 0.05)
                );

            pointer-events: none;
        }


        /* =================================================
           LOADING AREA
        ================================================= */

        .loading-wrapper {

            position: absolute;

            /*
               Position based on your screenshot.
               Desktop center.
            */

            left: 50%;

            top: 61.3%;

            transform:
                translate(-50%, -50%);

            width: min(440px, 30vw);

            text-align: center;

            z-index: 10;
        }


        /* =================================================
           LOADING TEXT
        ================================================= */

        .loading-title {

            color: white;

            font-size: clamp(13px, 1.3vw, 20px);

            font-weight: 500;

            margin-bottom: 9px;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.6);
        }


        /* =================================================
           PROGRESS BAR
        ================================================= */

        .progress-box {

            position: relative;

            width: 100%;

            height: 17px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.40);

            border:
                2px solid
                rgba(255,255,255,0.80);

            overflow: hidden;

            box-shadow:

                0 2px 8px
                rgba(0,0,0,0.30),

                inset 0 1px 4px
                rgba(0,0,0,0.15);
        }


        /* =================================================
           ANIMATED LOADING LINE
        ================================================= */

        .progress {

            position: absolute;

            left: 0;

            top: 0;

            width: 0%;

            height: 100%;

            border-radius: 30px;

            background:
                linear-gradient(
                    90deg,
                    #ff6b00 0%,
                    #ffb000 25%,
                    #ffffff 45%,
                    #20a875 70%,
                    #138808 100%
                );

            box-shadow:
                0 0 14px
                rgba(255,255,255,0.9);

            transition:
                width 0.05s linear;
        }


        /* =================================================
           MOVING GLOW
        ================================================= */

        .progress::after {

            content: "";

            position: absolute;

            top: 0;

            right: -80px;

            width: 80px;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.95),
                    transparent
                );

            animation:
                loadingGlow 0.8s
                linear infinite;
        }


        @keyframes loadingGlow {

            0% {
                transform: translateX(-80px);
            }

            100% {
                transform: translateX(80px);
            }
        }


        /* =================================================
           PERCENTAGE
        ================================================= */

        .percentage {

            position: absolute;

            right: -55px;

            top: 50%;

            transform:
                translateY(-50%);

            color: white;

            font-size: 14px;

            font-weight: 600;

            text-shadow:
                0 2px 5px rgba(0,0,0,0.7);
        }


        /* =================================================
           SKIP BUTTON
        ================================================= */

        .skip-button {

            position: absolute;

            right: 25px;

            bottom: 22px;

            z-index: 20;

            border: none;

            padding: 8px 18px;

            border-radius: 20px;

            color: white;

            background:
                rgba(20,30,50,0.45);

            border:
                1px solid
                rgba(255,255,255,0.35);

            backdrop-filter: blur(8px);

            cursor: pointer;

            font-size: 13px;

            transition: 0.3s;
        }


        .skip-button:hover {

            background:
                rgba(255,255,255,0.25);

            transform:
                translateY(-2px);
        }


        /* =================================================
           SMALL SCREEN
        ================================================= */

        @media (max-width: 900px) {

            .loading-wrapper {

                width: 300px;

                top: 61%;
            }

        }


        @media (max-width: 600px) {

            .welcome-screen {

                background-position:
                    center center;
            }

            .loading-wrapper {

                width: 220px;

                top: 60%;
            }

            .percentage {

                right: -42px;

                font-size: 12px;
            }

            .skip-button {

                right: 12px;

                bottom: 12px;

                font-size: 11px;

                padding:
                    7px 14px;
            }
        }


        /* =================================================
           VERY SMALL MOBILE
        ================================================= */

        @media (max-width: 400px) {

            .loading-wrapper {

                width: 190px;
            }
        }

    </style>

</head>


<body>


    <!-- =================================================
         FULL WELCOME SCREEN
    ================================================= -->

    <div class="welcome-screen">

        <div class="screen-overlay"></div>


        <!-- =================================================
             ANIMATED LOADING
        ================================================= -->

        <div class="loading-wrapper">

            <div class="loading-title">
                Preparing your safe journey...
            </div>


            <div class="progress-box">

                <div
                    class="progress"
                    id="progress">
                </div>

                <span
                    class="percentage"
                    id="percentage">
                    0%
                </span>

            </div>

        </div>


        <!-- =================================================
             SKIP
        ================================================= -->

        <button
            class="skip-button"
            onclick="goToLogin()">

            Skip →

        </button>

    </div>



    <script>

        /* ================================================
           5 SECOND LOADING
        ================================================= */

        const progress =
            document.getElementById("progress");

        const percentage =
            document.getElementById("percentage");


        const startTime =
            performance.now();

        const duration =
            5000;


        let redirected = false;


        /* ================================================
           REDIRECT
        ================================================= */

        function goToLogin() {

            if (redirected) return;

            redirected = true;

            window.location.href =
                "index.html";
        }


        /* ================================================
           ANIMATION
        ================================================= */

        function animateLoading(currentTime) {

            const elapsed =
                currentTime - startTime;


            let percent =
                (elapsed / duration) * 100;


            if (percent > 100) {

                percent = 100;

            }


            progress.style.width =
                percent + "%";


            percentage.textContent =
                Math.floor(percent) + "%";


            if (percent < 100) {

                requestAnimationFrame(
                    animateLoading
                );

            } else {

                /*
                   Small delay so the user
                   can see 100%
                */

                setTimeout(
                    goToLogin,
                    100
                );
            }
        }


        /* ================================================
           START
        ================================================= */

        window.addEventListener(
            "load",
            function() {

                requestAnimationFrame(
                    animateLoading
                );

            }
        );

    </script>

</body>
</html>
